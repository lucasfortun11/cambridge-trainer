services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cambridge
      POSTGRES_PASSWORD: cambridge
      POSTGRES_DB: cambridge_trainer
    ports:
      # Host port 5434 (not the default 5432) so this never collides with a
      # Postgres instance you may already have running locally.
      - "5434:5432"
    volumes:
      - cambridge_db_data:/var/lib/postgresql/data

volumes:
  cambridge_db_data:
